# cmx-flowengine —— 独立流程引擎微服务（从 cmx-container 抽出的 S0 骨架）。
#
# 方案见 docs/standalone-microservice-design.html。本 workspace 承载与平台/框架解耦的
# 流程引擎全部 crate（model/bpmn/engine/def/store-pg）+ 独立可跑 demo + 引擎测试套件。
# 平台适配层 cmx-flow-api 仍留在 cmx-container（keep-wired，经跨 workspace 路径引用本库）。
#
# 依赖策略：域内 flow crate 纯 path；基础设施（cmx-database-pg / cmx-core）以 path 复用
# cmx-container 的成员 crate（它们仍属 cmx-container workspace，对其根解析 workspace=true
# 与 [patch.nora]，故本库无需 nora 私仓、无需把 infra 纳入 members）；外部 crate 走 aliyun
# 镜像（见 .cargo/config.toml），版本与 cmx-container 根对齐以便 Cargo 合一。
[workspace]
resolver = "2"
members = [
    "crates/cmx-flow-model",
    "crates/cmx-flow-bpmn",
    "crates/cmx-flow-engine",
    "crates/cmx-flow-def",
    "crates/cmx-flow-store-pg",
    "crates/cmx-flow-adapters",
    "crates/cmx-flow-identity",
    "crates/cmx-flow-app",
    "crates/cmx-flow-server",
    "crates/cmx-flow-demo",
    "crates/cmx-flow-tests",
    "crates/cmx-flow-worker-sdk",
]

[workspace.package]
# 与 cmx-container 对齐（迁走的 crate 用 version.workspace/edition.workspace/authors.workspace）
version = "0.1.12"
edition = "2024"
authors = ["skylake@pansoft.com"]

[workspace.dependencies]
# —— 域内 flow crate（纯 path，不经私仓）——
cmx-flow-model = { path = "crates/cmx-flow-model", version = "0.1.12" }
cmx-flow-bpmn = { path = "crates/cmx-flow-bpmn", version = "0.1.12" }
cmx-flow-engine = { path = "crates/cmx-flow-engine", version = "0.1.12" }
cmx-flow-def = { path = "crates/cmx-flow-def", version = "0.1.12" }
cmx-flow-store-pg = { path = "crates/cmx-flow-store-pg", version = "0.1.12" }
cmx-flow-adapters = { path = "crates/cmx-flow-adapters", version = "0.1.12" }
cmx-flow-identity = { path = "crates/cmx-flow-identity", version = "0.1.12" }
cmx-flow-app = { path = "crates/cmx-flow-app", version = "0.1.12" }

# —— 复用 cmx-container 基础设施（跨 workspace 路径；仍是 cmx-container 成员，非本库成员）——
# tokio-postgres 并行 DB 层（多数据源池 / register_datasource / query_sql / 事务门面）
cmx-database-pg = { path = "../cmx-container/crates/libs/cmx-infra/cmx-database-pg", version = "0.1.12" }
# 核心库（DataValue：强类型写入参数 / 查询结果读取）
cmx-core = { path = "../cmx-container/crates/libs/cmx-core", version = "0.1.12" }
# 通用 HTTP 服务骨架（chassis）：flow/report/mdm-server 共用的启动/日志/中间件/优雅关闭骨架
cmx-web-chassis = { path = "../cmx-container/crates/libs/cmx-web-chassis", version = "0.1.12" }
# 通用技术监控：请求遥测 + 系统指标（CPU/内存/网络/磁盘）+ DB 连接池；与 chassis 并列组装
cmx-web-monitor = { path = "../cmx-container/crates/libs/cmx-web-monitor", version = "0.1.12" }
# 基础服务库：pg 数据源注册原语（default-features=false → 不拉 Redis/sqlx，flow 零负担）
cmx-service-base = { path = "../cmx-container/crates/libs/cmx-service-base", version = "0.1.12", default-features = false }
# mdm 契约 SDK（webhook 回调投递：签名 + 服务目录定位）
cmx-mdm-sdk = { path = "../cmx-container/crates/libs/cmx-mdm/cmx-mdm-sdk", version = "0.1.12" }
cmx-service-rpc = { path = "../cmx-container/crates/libs/cmx-infra/cmx-service-rpc", version = "0.1.12" }
# 配置中台（ConfigManager）：flow-app 页面资产目录（assets_ui_*）/auth 段等业务配置直读
cmx-utils = { path = "../cmx-container/crates/libs/cmx-utils", version = "0.1.12" }
# 页面只读投递（native/html-pages 六端点通用路由，收编原 cmx-flow-app frontend_pages.rs）
cmx-form = { path = "../cmx-container/crates/libs/cmx-form", version = "0.1.12" }
# 引擎应用层横切件单源（tenant 上下文 / dbid 路由 / 两族 auth 中间件 / resp 别名——收编本仓 tenant.rs 等同源副本）
cmx-engine-kit = { path = "../cmx-container/crates/libs/cmx-engine-kit", version = "0.1.12" }

# —— 外部 crate（版本照抄 cmx-container 根 [workspace.dependencies]）——
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1.0"
# 非加密内容哈希（前端页 rev = xxhash64→16hex，字节对齐门户 cmx-jsonstore::content_rev）
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# JWT 验签（S2 认证：验 HS256/RS256 签名，解 tenant/user/roles claim）
jsonwebtoken = "9"
# SSE 事件流（S3）：broadcast → axum Sse 的流适配
tokio-stream = { version = "0.1", features = ["sync"] }
# OpenAPI（S3 headless 契约）：注解 + swagger UI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
roxmltree = "0.20"
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-full", "timeout", "limit"] }
# 自动读取 .env（与门户 cmx-platform-app 一致：统一启动契约，bin 自读 .env 无需手动 source）
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"

# 测试 profile（继承 dev）：专为 cargo test 裁剪体积
# debug = 1：仅保留行号表（backtrace 仍有行号可定位），测试二进制体积大幅缩小
# incremental = true：保留增量编译，改动后重跑测试更快
[profile.test]
debug = 1
incremental = true

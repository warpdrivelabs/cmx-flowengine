# cmx-flow-server 实际配置（认证对齐平台，供独立微服务模式使用）。
#
# 加载顺序：本文件（路径由 FLOW_CONFIG 指定，或默认 ./flow-server.toml）→ 环境变量覆盖。
# 环境变量优先级最高（同名 FLOW_* 环境变量若已设置，覆盖本文件对应值）。
#
# 认证/数据源段（[auth]/[datasource]）由 flow-server main.rs 的 apply_toml_env() 读出并注入
# FLOW_* 环境变量——auth.rs/tenant.rs 仍读环境变量，本文件是其 toml 承载。

# —— chassis 框架级 ——
host = "0.0.0.0"
port = 8091
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

# —— 数据源（→ FLOW_PG_URL / IAM_PG_URL）——
[datasource]
flow_pg_url = "postgres://postgres:postgres@127.0.0.1:5432/fico"   # 运行态 + 定义库
iam_pg_url  = "postgres://postgres:postgres@127.0.0.1:5432/cmx"    # 候选人/组织库

# —— 认证（与平台对齐；平台经 FlowProxyModule 转发时注入 X-API-Key + X-Delegated-User-Token）——
[auth]
mode = "jwt"                # 生产务必 jwt（off 模式租户取 X-Tenant 头，越权隐患）
jwt_alg = "HS256"           # 与平台 JwtConfig 算法一致

# ★ 委托令牌始终验签，此密钥必须 = 平台签发 JWT 的密钥。
#   平台真源：cmx-container 未配 [auth.jwt] 段 → 用 JwtConfig 默认
#   (crates/libs/cmx-infra/cmx-auth/src/config.rs 的 JwtConfig 默认 secret)。
#   若平台 dev-local.toml 配了自定义 auth.jwt.secret，改成那个值。
jwt_secret = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"
jwt_tenant_claim = "tenant"
jwt_roles_claim = "roles"

# ★ 服务间 API Key（命中即免 JWT 验签，key:回退租户）。
#   必须 = 平台 [service_auth].outgoing_api_key（cmx-container/dev-local.toml）。
#   平台代理注入 X-API-Key 为此值，命中后走服务身份 + 委托令牌取真实办理人。
api_keys = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6:default"

# 多租户（默认单库；db-per-tenant 隔离时设 multi）
# tenancy = "single"

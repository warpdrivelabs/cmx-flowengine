[package]
name = "cmx-flow-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

# cmx-flow 独立流程微服务的 **HTTP 服务器**（方案 standalone-microservice-design.html §2/§10 S0）。
#
# 采用通用骨架 cmx-web-chassis（与 report-server / mdm-server 同一套启动/日志/中间件/优雅关闭/
# banner），只提供 flow 相关 API。main 只填一个 ServiceSpec：flow_routes 路由 + 数据源注册钩子 +
# 引擎定时器 poller 钩子 + flow 专属 banner/配色，交 chassis::run 统一装配。零 cmx-api / 零平台依赖。

[[bin]]
name = "cmx-flow-server"
path = "src/main.rs"

[dependencies]
# 平台中立核（引擎单例 + 全部 handler + flow_routes::<S>() + 信封）
cmx-flow-app = { workspace = true }
# 通用 HTTP 服务骨架（配置/日志/中间件/优雅关闭/banner + ServiceSpec/run）
cmx-web-chassis = { workspace = true }
# 通用技术监控（注入 flow 身份读取器；技术页 /_mon 由 chassis 自动挂）
cmx-web-monitor = { workspace = true }
# tokio-postgres DB 层（注册数据源）
cmx-database-pg = { workspace = true }
# 基础服务库：pg 数据源注册原语 + **统一 ConfigManager 装配**（init_config_manager，与 portal 同一套）。
# config-manager feature 拉入 cmx-utils（ConfigManager），使 flow 与 portal/report/mdm 走同一配置制度。
cmx-service-base = { workspace = true, features = ["config-manager"] }

# Web 框架（Router 类型；服务栈由 chassis 提供）
axum = { workspace = true }
# swagger UI 挂载（S3 headless OpenAPI 文档）
utoipa-swagger-ui = { workspace = true }
# 异步运行时（#[tokio::main]）
tokio = { workspace = true }
# 自动读取 .env（统一启动契约：与门户一致，bin 自读 .env，无需手动 source）
dotenvy = { workspace = true }
# 启动钩子错误通道
anyhow = { workspace = true }
# 日志（钩子内 tracing::info）
tracing = { workspace = true }
# 认证/数据源 toml 配置段解析（[auth]/[datasource] → set_var 注入 FLOW_* 环境变量）
toml = { workspace = true }
serde = { workspace = true }

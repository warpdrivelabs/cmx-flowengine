[package]
name = "cmx-flow-worker-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 外部 job worker 客户端 SDK（A7/P1）。第三方进程用它把 serviceTask(type=external-worker,topic=..)
# 的执行体拉到平台外运行：轮询 acquire 按 topic 抢占作业 → 跑用户 handler → 回调 complete/fail。
# 纯 HTTP 客户端，零引擎依赖——可被任意 Rust 服务/worker 引入。

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
